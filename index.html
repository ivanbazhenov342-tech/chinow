<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#34464a" />
    <meta
      name="description"
      content="Шаньцзян — путешествие по живому китайскому городу. Китайский с первых слов до бытовых разговоров через игровые истории."
    />
    <title>Шаньцзян · Маленькие шаги в большой мир</title>
    <link rel="stylesheet" href="./station.css?v=7" />
  </head>
  <body>
    <main id="world" aria-label="Игровой мир Шаньцзяна">
      <div id="loading">Собираем чемодан…</div>
      <div id="fallback" hidden>
        3D-мир недоступен на этом устройстве. Историю и задания можно пройти
        кнопками.
      </div>
    </main>
    <header class="topbar">
      <button class="brand" id="home" aria-label="Открыть карту Шаньцзяна">
        <span class="seal">山江</span
        ><span
          ><strong>Шаньцзян</strong
          ><small id="place">Восточный вокзал</small></span
        >
      </button>
      <nav aria-label="Путешествие">
        <button id="map-button">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Z M9 3v16 M15 5v16" /></svg
          >Карта
        </button>
        <button id="book-button">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 3h14v18H5z M8 3v18 M11 8h5 M11 12h5" /></svg
          >Дневник <span id="word-count">0</span>
        </button>
      </nav>
    </header>
    <div class="world-caption" aria-hidden="true">
      <span id="district-hanzi">初见</span
      ><span id="district-subtitle">Город начинается со встречи</span>
    </div>
    <div class="camera-controls" aria-label="Управление камерой">
      <button id="rotate-left" aria-label="Повернуть камеру влево">↶</button>
      <button id="rotate-right" aria-label="Повернуть камеру вправо">↷</button>
      <button id="zoom-in" aria-label="Приблизить">+</button>
      <button id="zoom-out" aria-label="Отдалить">−</button>
    </div>
    <aside class="story-panel" id="story-panel" aria-label="Текущая миссия">
      <div class="story-top">
        <span class="eyebrow" id="eyebrow">Глава первая</span
        ><span class="story-tools"
          ><button
            class="quiet"
            id="mission-toggle"
            aria-expanded="true"
            aria-controls="story-title story-text speech actions"
          >
            Свернуть</button
          ><button class="quiet" id="help-button" aria-label="Как играть">
            ?
          </button></span
        >
      </div>
      <div class="progress-track"><span id="story-progress"></span></div>
      <h1 id="story-title">Добро пожаловать в Шаньцзян</h1>
      <p id="story-text"></p>
      <div id="speech"></div>
      <p id="feedback" role="status" aria-live="polite"></p>
      <div id="actions"></div>
    </aside>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="overlay">
      <div class="dialog-header">
        <div>
          <span class="eyebrow" id="overlay-label"></span>
          <h2 id="overlay-title"></h2>
        </div>
        <button id="close-overlay" aria-label="Закрыть">×</button>
      </div>
      <div id="overlay-content"></div>
    </dialog>
    <script src="./vendor/hanzi-writer.min.js"></script>
    <script type="module" src="./app.js?v=7"></script>
  </body>
</html>
