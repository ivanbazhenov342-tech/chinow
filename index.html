<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><meta name="theme-color" content="#eae4cd" /><title>
    Шаньцзян · Прибытие</title
  ><link rel="stylesheet" href="./station.css" />
  <header>
    <div class="seal">小步</div>
    <div><small>ШАНЬЦЗЯН</small><strong>Восточный вокзал</strong></div>
    <button id="ticket">Мой билет</button>
  </header>
  <main id="view" aria-label="Трёхмерный вокзал">
    <div id="fallback" hidden>
      На этом устройстве не открылся 3D-вид. Пройти миссию можно кнопками ниже.
    </div>
    <nav aria-label="Повернуть вид">
      <button id="left" aria-label="Повернуть влево">↶</button
      ><button id="right" aria-label="Повернуть вправо">↷</button>
    </nav>
  </main>
  <section aria-live="polite">
    <small id="step"></small>
    <h1 id="title"></h1>
    <p id="story"></p>
    <div id="actions"></div>
  </section>
  <dialog>
    <small>山江站 · ПРОЕЗДНОЙ БИЛЕТ</small>
    <h2>Прибытие в Шаньцзян</h2>
    <p>Вагон 03 · Место 16 · Платформа 1</p>
    <blockquote>«Я буду ждать у выхода с синим зонтом».</blockquote>
    <button id="close">Сложить билет</button>
  </dialog>
  <script type="module" src="./station.js"></script>
</html>
